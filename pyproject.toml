[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rethebes"
dynamic = ["version"]
description = "Repeatable thermal benchmarks"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Giulio Foletto", email = "giulio.foletto@outlook.com" },
]
requires-python = "==3.13.*"
dependencies = [
    "click~=8.3.0",
    "matplotlib~=3.10.0",
    "numpy~=2.3.0",
    "pandas~=2.3.0",
    "psutil~=7.1.0",
    "hardwaremonitor==1.0.0",
    "pyzmq~=27.1.0",
]

[project.scripts]
rethebes = "rethebes.__main__:main"

[project.urls]
Homepage = "https://github.com/giuliofoletto/rethebes"

[tool.hatch.version]
path = "rethebes/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/rethebes",
]
